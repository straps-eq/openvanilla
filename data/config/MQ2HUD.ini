[MQ2HUD]
Last=Elements
SkipParse=1
CheckINI=10
UpdateInBackground=on
ClassHUD=off
ZoneHUD=off
UseFontSize=off

[Elements]
Zone=3,5,50,255,255,255,${Zone.Name} (${Zone.ShortName})
Loc=3,5,62,200,200,200,Loc: ${Me.Y.Int}, ${Me.X.Int}, ${Me.Z.Int}  Facing: ${Me.Heading.ShortName}
Time=3,5,74,200,200,200,${Time.Time12}  Game: ${GameTime.Time12}
Target=3,5,90,255,255,0,${If[${Target.ID},Target: ${Target.DisplayName} (${Target.Level} ${Target.Class.ShortName}) ${Target.PctHPs}%  Dist: ${Target.Distance.Int},]}
XP=3,5,102,150,200,255,XP: ${Me.PctExp}%  AA: ${Me.PctAAExp}% (${Me.AAPoints} banked)
Macro=3,5,114,0,255,0,${If[${Macro.Name.NotEqual[NULL]},Macro: ${Macro.Name},]}
